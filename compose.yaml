services:
  app:
    build: .
    env_file: .env
    environment:
      GASSI_BASE_URL: https://gassiplan.verboese.de
      GASSI_DB: /data/gassi.sqlite3
    expose:
      - "8585"
    volumes:
      - gassi-data:/data
    restart: unless-stopped

  caddy:
    image: caddy:2
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  gassi-data:
  caddy-data:
  caddy-config:
