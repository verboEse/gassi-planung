services:
  app:
    build: .
    env_file: .env
    environment:
      GASSI_BASE_URL: https://gassiplan.verboese.de
      GASSI_DB: /data/gassi.sqlite3
    expose:
      - "8585"
    volumes:
      - gassi-data:/data
    networks:
      proxy:
        aliases:
          - gassi-planung-app
    restart: unless-stopped

networks:
  proxy:
    external: true
    name: traefik_proxy

volumes:
  gassi-data:
